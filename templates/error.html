{% extends "base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block content %}
<div class="card empty">
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  {% if detail %}<pre class="error-detail">{{ detail }}</pre>{% endif %}
  <a class="btn btn-primary" href="{{ url_for('dashboard') }}">Back to dashboard</a>
</div>
{% endblock %}
